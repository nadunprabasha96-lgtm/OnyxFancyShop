<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - ONYX FANCY SHOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --dark-bg: #0f0f12;
            --card-bg: #18181c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .logo {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .logo span {
            color: var(--primary-gold);
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--primary-gold);
            border-bottom: 2px solid var(--primary-gold);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 13px;
            color: #ccc;
        }

        .input-group input, .input-group select {
            padding: 12px 15px;
            background: #111115;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-gold);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #000;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .alert-msg {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">ONYX <span>FANCY</span></div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <div id="alertBox" class="alert-msg"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="form-section active" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-submit">Login to Account</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="form-section" onsubmit="handleSignup(event)">
            <div class="form-grid">
                
                <div class="input-group full-width">
                    <label>Full Name (සම්පූර්ණ නම)</label>
                    <input type="text" id="fullName" placeholder="John Doe" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" placeholder="example@mail.com" required>
                </div>

                <div class="input-group">
                    <label>Phone Number (දුරකථන අංකය)</label>
                    <input type="tel" id="phoneNumber" placeholder="0771234567" required>
                </div>

                <div class="input-group full-width">
                    <label>Address (ලිපිනය)</label>
                    <input type="text" id="streetAddress" placeholder="Street Address / House No." required>
                </div>

                <div class="input-group">
                    <label>Town / City (නගරය)</label>
                    <input type="text" id="town" placeholder="e.g. Colombo, Kandy" required>
                </div>

                <div class="input-group">
                    <label>Province (පළාත)</label>
                    <select id="province" required>
                        <option value="">Select Province</option>
                        <option value="Western">Western</option>
                        <option value="Central">Central</option>
                        <option value="Southern">Southern</option>
                        <option value="North Western">North Western</option>
                        <option value="Sabaragamuwa">Sabaragamuwa</option>
                        <option value="Eastern">Eastern</option>
                        <option value="Uva">Uva</option>
                        <option value="North Central">North Central</option>
                        <option value="Northern">Northern</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Postal Code (තැපැල් කේතය)</label>
                    <input type="text" id="postalCode" placeholder="e.g. 10100" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Create password" required>
                </div>

            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>
    </div>

    <script>
        // Tab Swapping Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
            hideAlert();

            if (tabName === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('signupForm').classList.add('active');
            }
        }

        // Display Alerts
        function showAlert(msg, isSuccess = true) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.className = 'alert-msg ' + (isSuccess ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        // Save User Data (Registration)
        function handleSignup(e) {
            e.preventDefault();

            const userData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('signupEmail').value,
                phone: document.getElementById('phoneNumber').value,
                address: document.getElementById('streetAddress').value,
                town: document.getElementById('town').value,
                province: document.getElementById('province').value,
                postalCode: document.getElementById('postalCode').value,
                password: document.getElementById('signupPassword').value
            };

            // Save user info in browser's local storage
            let users = JSON.parse(localStorage.getItem('onyx_users')) || [];
            
            // Check if email already exists
            const userExists = users.some(u => u.email === userData.email);
            if (userExists) {
                showAlert("මෙම Email ලිපිනය මඟින් 이미 Account එකක් සාදා ඇත!", false);
                return;
            }

            users.push(userData);
            localStorage.setItem('onyx_users', JSON.stringify(users));

            showAlert("Account එක සාර්ථකව සාදන ලදී! දැන් Login වන්න.");
            document.getElementById('signupForm').reset();
            setTimeout(() => switchTab('login'), 1500);
        }

        // Login User Logic
        function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            let users = JSON.parse(localStorage.getItem('onyx_users')) || [];
            
            // Validate credentials
            const validUser = users.find(u => u.email === email && u.password === password);

            if (validUser) {
                // Save current logged in session
                localStorage.setItem('onyx_logged_user', JSON.stringify(validUser));
                showAlert("Login සාර්ථකයි! වෙබ් සයිට් එක වෙත යොමු කෙරේ...");
                setTimeout(() => {
                    window.location.href = 'index.html'; // Navigate back to main store
                }, 1500);
            } else {
                showAlert("Email එක හෝ Password එක වැරදියි!", false);
            }
        }
    </script>
</body>
</html>
