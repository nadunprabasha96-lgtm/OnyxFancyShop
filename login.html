<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | ONYX FANCY SHOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --dark-bg: #0f0f12;
            --card-bg: #18181c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background: var(--card-bg);
            border: 1px solid var(--primary-gold);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .brand-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .brand-title span {
            color: var(--primary-gold);
            background: var(--gold-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--primary-gold);
            border-bottom-color: var(--primary-gold);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: #ccc;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: #0f0f12;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-gold);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            color: #888;
            cursor: pointer;
            font-size: 14px;
        }

        .toggle-password:hover {
            color: var(--primary-gold);
        }

        .btn-submit {
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            border: none;
            color: #000;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 class="brand-title">ONYX <span>FANCY</span> SHOP</h2>

        <div class="tabs">
            <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                </div>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <!-- Signup Form -->
        <form class="auth-form" id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Full Name (සම්පූර්ණ නම)</label>
                <input type="text" id="signupName" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" id="signupWhatsapp" required placeholder="07XXXXXXXX">
            </div>
            <div class="form-group">
                <label>Address (ලිපිනය)</label>
                <input type="text" id="signupAddress" required placeholder="No. 123, Main Street">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>City (නගරය)</label>
                    <input type="text" id="signupCity" required placeholder="Colombo">
                </div>
                <div class="form-group">
                    <label>Postal Code</label>
                    <input type="text" id="signupPostalCode" required placeholder="10100">
                </div>
            </div>
            <div class="form-group">
                <label>Province (පළාත)</label>
                <select id="signupProvince" required>
                    <option value="">තෝරන්න...</option>
                    <option value="Western">Western</option>
                    <option value="Central">Central</option>
                    <option value="Southern">Southern</option>
                    <option value="North Western">North Western</option>
                    <option value="Sabaragamuwa">Sabaragamuwa</option>
                    <option value="Eastern">Eastern</option>
                    <option value="Uva">Uva</option>
                    <option value="North Central">North Central</option>
                    <option value="Northern">Northern</option>
                </select>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="signupPassword" required placeholder="••••••••">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('signupPassword', this)"></i>
                </div>
            </div>
            <button type="submit" class="btn-submit">Sign Up</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // පරිශීලකයා දැනටමත් Signup වී ඇත්නම් Signup Tab එක සඟවා තබයි
            const registeredUsers = JSON.parse(localStorage.getItem("onyx_registered_users") || "[]");
            if (registeredUsers.length > 0) {
                document.getElementById("signupTabBtn").style.display = "none";
            }
        });

        function switchTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const signupForm = document.getElementById("signupForm");
            const loginTabBtn = document.getElementById("loginTabBtn");
            const signupTabBtn = document.getElementById("signupTabBtn");

            if (tab === 'login') {
                loginForm.classList.add("active");
                signupForm.classList.remove("active");
                loginTabBtn.classList.add("active");
                signupTabBtn.classList.remove("active");
            } else {
                signupForm.classList.add("active");
                loginForm.classList.remove("active");
                signupTabBtn.classList.add("active");
                loginTabBtn.classList.remove("active");
            }
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        function handleSignup(event) {
            event.preventDefault();
            const registeredUsers = JSON.parse(localStorage.getItem("onyx_registered_users") || "[]");

            const newUser = {
                fullName: document.getElementById("signupName").value.trim(),
                email: document.getElementById("signupEmail").value.trim().toLowerCase(),
                whatsapp: document.getElementById("signupWhatsapp").value.trim(),
                address: document.getElementById("signupAddress").value.trim(),
                city: document.getElementById("signupCity").value.trim(),
                postalCode: document.getElementById("signupPostalCode").value.trim(),
                province: document.getElementById("signupProvince").value,
                password: document.getElementById("signupPassword").value
            };

            const exists = registeredUsers.some(user => user.email === newUser.email);
            if (exists) {
                alert("මෙම Email එකෙන් දැනටමත් Account එකක් සාදා ඇත. කරුණාකර Sign In වන්න.");
                switchTab('login');
                return;
            }

            registeredUsers.push(newUser);
            localStorage.setItem("onyx_registered_users", JSON.stringify(registeredUsers));

            // පරිශීලකයා Log in කර ප්‍රධාන පිටුවට යවයි
            localStorage.setItem("onyx_logged_user", JSON.stringify(newUser));
            alert("Account එක සාර්ථකව සාදන ලදී!");
            window.location.href = "index.html";
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value;

            const registeredUsers = JSON.parse(localStorage.getItem("onyx_registered_users") || "[]");

            // Admin සඳහා කෙළින්ම ඇතුළු වීමට ඉඩ සලසයි
            if (email === "onyxfancy214@gmail.com" && password === "Onyx2003@#") {
                const adminUser = { fullName: "Admin User", email: email, whatsapp: "0770657250" };
                localStorage.setItem("onyx_logged_user", JSON.stringify(adminUser));
                window.location.href = "index.html";
                return;
            }

            const user = registeredUsers.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem("onyx_logged_user", JSON.stringify(user));
                window.location.href = "index.html";
            } else {
                alert("Email එක හෝ Password එක වැරදිය. කරුණාකර නැවත උත්සාහ කරන්න.");
            }
        }
    </script>
</body>
</html>
